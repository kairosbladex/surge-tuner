[MITM]
; ⚠️ MITM 配置需用户自行生成 CA 证书
; 详见 docs/mitm-setup.md
; enable = true
; h2 = true
; skip-server-cert-verify = true
; hostname = -*.apple.com, -*.icloud.com, -*.mzstatic.com, -*.crashlytics.com, [你的MITM域名]
; ca-passphrase = 【你的CA密码】
; ca-p12 = 【你的CA证书Base64】
